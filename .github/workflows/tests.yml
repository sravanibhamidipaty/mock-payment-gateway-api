name: API Tests

# 1. When should this robot run?
# Answer: Every time code is pushed to the 'main' branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 2. What jobs should the robot do?
jobs:
  test:
    # Rent a standard Ubuntu Linux computer
    runs-on: ubuntu-latest

    # Tell GitHub to spin up a Postgres database just for this job!
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          # In the cloud, the standard port 5432 is always free!
          - "5432:5432"
        # Give it a beeper so GitHub knows when the DB is ready.
        # NOTE: the `secrets` context isn't allowed in service `options`, and
        # pg_isready reports readiness regardless of user/db, so no creds needed.
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step A: Download the code from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step B: Install Python on the machine
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # This caches dependencies so future tests run lightning fast!
          cache: "pip"

      # Step C: Install your project's requirements
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step C.5: Manually trigger the database table creation
      - name: Create Database Tables
        env:
          DATABASE_URL: postgresql+asyncpg://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}
          # Give Python the map to the src folder just like Pytest has
          PYTHONPATH: src
        run: |
          python -c '
          import asyncio
          from database import engine, Base
          import models
          
          async def setup_db():
              async with engine.begin() as conn:
                  await conn.run_sync(Base.metadata.create_all)
                  
          asyncio.run(setup_db())
          '

      # Step D: Run the exact same Pytest command you run locally!
      - name: Run Pytest
        env:
          API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
          DATABASE_URL: postgresql+asyncpg://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}
        run: pytest