name: API Tests

# 1. When should this robot run?
# Answer: Every time code is pushed to the 'main' branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 2. What jobs should the robot do?
jobs:
  test:
    # Rent a standard Ubuntu Linux computer
    runs-on: ubuntu-latest

    # Tell GitHub to spin up a Postgres database just for this job!
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: payment_db
        ports:
          # In the cloud, the standard port 5432 is always free!
          - "5432:5432"
        # Give it a beeper so GitHub knows when the DB is ready
        # THE FIX: We explicitly tell the beeper to use the 'admin' user and 'payment_db'
        options: >-
          --health-cmd "pg_isready -U admin -d payment_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step A: Download the code from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step B: Install Python on the machine
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # This caches dependencies so future tests run lightning fast!
          cache: "pip"

      # Step C: Install your project's requirements
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step D: Run the exact same Pytest command you run locally!
      - name: Run Pytest
        env:
          API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
          # Notice we changed the URL back to 5432 here as well!
          DATABASE_URL: postgresql+asyncpg://admin:secretpassword@localhost:5432/payment_db
        run: pytest