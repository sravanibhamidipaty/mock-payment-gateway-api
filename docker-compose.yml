version: '3.8'

services:
  # BOX 1: The Database
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: payment_db
    ports:
      - "5433:5432"
    healthcheck:
      # This pings the database to ask "Are you ready?"
      test: ["CMD-SHELL", "pg_isready -U admin -d payment_db"]
      interval: 2s
      timeout: 2s
      retries: 5

  # BOX 2: The Bouncer Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # BOX 3: Kafka
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  # Box 4: FastAPI App
  api:
    # This tells Docker to look for your Dockerfile in the current folder
    build: .
    ports:
      - "8000:8000"
    environment:
      # We pass the secret key directly into the vault
      - API_KEY_SECRET=sk_test_12345
      # CRITICAL: Notice the URL says '@db' instead of '@localhost'!
      # This tells the API to talk to the 'db' box we created above.
      - DATABASE_URL=postgresql+asyncpg://admin:secretpassword@db:5432/payment_db
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_URL=kafka:9092
    depends_on:
      # Don't start the API until the database is awake
      db:
        condition: service_healthy
      # Don't start the API until Redis is awake
      redis:
        condition: service_started
      # Don't start the API until Kafka is awake
      kafka:
        condition: service_started

    # Box 5: The Background Worker
  worker:
    build: .
    # We override the default command so it runs worker.py instead of FastAPI
    command: python src/worker.py
    environment:
      # The worker only needs to talk to the DB and Kafka (no Redis needed!)
      - DATABASE_URL=postgresql+asyncpg://admin:secretpassword@db:5432/payment_db
      - KAFKA_URL=kafka:9092
      # Give Python the map to the src folder
      - PYTHONPATH=src
      - PYTHONUNBUFFERED=1
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started

  floci:
    image: floci/floci:latest
    ports:
      - "4567:4566"