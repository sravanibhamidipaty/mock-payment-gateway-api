version: '3.8'

services:
  # BOX 1: The Database
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    healthcheck:
      # This pings the database to ask "Are you ready?"
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 5

  # BOX 2: The Bouncer Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # BOX 3: Kafka
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  # Box 4: FastAPI App
  api:
    # This tells Docker to look for your Dockerfile in the current folder
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - API_KEY_SECRET=${API_KEY_SECRET}
      # Built from the POSTGRES_* vars; '@db' points at the db service above.
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=${REDIS_URL}
      - KAFKA_URL=${KAFKA_URL}
    depends_on:
      # Don't start the API until the database is awake
      db:
        condition: service_healthy
      # Don't start the API until Redis is awake
      redis:
        condition: service_started
      # Don't start the API until Kafka is awake
      kafka:
        condition: service_started

    # Box 5: The Background Worker
  worker:
    build: .
    # We override the default command so it runs worker.py instead of FastAPI
    command: python src/worker.py
    env_file:
      - .env
    environment:
      # The worker only needs to talk to the DB and Kafka (no Redis needed!)
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - KAFKA_URL=${KAFKA_URL}
      - NOTIFIER_URL=${NOTIFIER_URL}
      # Give Python the map to the src folder
      - PYTHONPATH=src
      - PYTHONUNBUFFERED=1
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started

  floci:
    image: floci/floci:latest
    ports:
      - "4567:4566"

  notifier:
    build: .
    command: uvicorn src.notifier:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - PYTHONPATH=src
      - SENDER_EMAIL=${SENDER_EMAIL}
      - APP_PASSWORD=${APP_PASSWORD}
      - RECEIVER_EMAIL=${RECEIVER_EMAIL}